<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    🎨 Furina Chibi Blob SVG 
    Created by: Antigravity Code Assistant
  -->

  <!-- Style Definitions -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0e6ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 1. Main Body (The Blob) -->
  <!-- A slightly rotated ellipse-like shape -->
  <path d="M50 100 
           Q40 150 80 160 
           Q120 170 150 140 
           Q180 110 160 70 
           Q140 30 100 40 
           Q60 50 50 100" 
        fill="url(#bodyGradient)" stroke="#6a7a9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Hair (The White/Blue Fluff) -->
  <!-- Left Side -->
  <path d="M60 60 Q40 80 45 100 Q60 90 70 75" fill="#eaf4ff" stroke="#6a7a9e" stroke-width="2"/>
  <path d="M45 100 Q40 120 55 115" fill="none" stroke="#6a7a9e" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right Side -->
  <path d="M140 60 Q160 80 155 100 Q140 90 130 75" fill="#eaf4ff" stroke="#6a7a9e" stroke-width="2"/>
  <path d="M155 100 Q160 120 145 115" fill="none" stroke="#6a7a9e" stroke-width="2" stroke-linecap="round"/>

  <!-- Bangs (Top) -->
  <path d="M70 60 Q100 80 130 60 Q100 50 70 60" fill="#ffffff" stroke="#6a7a9e" stroke-width="2"/>
  
  <!-- Ahoge (The Antenna) -->
  <path d="M90 50 Q80 20 100 30" fill="none" stroke="#6a7a9e" stroke-width="2" stroke-linecap="round"/>

  <!-- 3. Face (Simple & Cute) -->
  <!-- Eyes (Closed Happy) -->
  <path d="M80 100 Q90 95 100 100" fill="none" stroke="#3d4c6e" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 100 Q130 95 140 100" fill="none" stroke="#3d4c6e" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Mouth (:3) -->
  <path d="M105 110 Q110 115 115 110" fill="none" stroke="#3d4c6e" stroke-width="2" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="85" cy="115" rx="5" ry="3" fill="#ffccd5" opacity="0.6"/>
  <ellipse cx="135" cy="115" rx="5" ry="3" fill="#ffccd5" opacity="0.6"/>

  <!-- 4. Top Hat (Signature Item) -->
  <!-- Brim -->
  <ellipse cx="130" cy="50" rx="20" ry="8" fill="#ffffff" stroke="#4a5a7e" stroke-width="2" transform="rotate(-15 130 50)"/>
  <!-- Top -->
  <path d="M118 48 L115 25 Q130 20 145 25 L142 48" fill="#6a7a9e" stroke="#4a5a7e" stroke-width="2" transform="rotate(-15 130 50)"/>
  <!-- Ribbon -->
  <path d="M118 42 L142 42" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(-15 130 50)"/>

</svg>
